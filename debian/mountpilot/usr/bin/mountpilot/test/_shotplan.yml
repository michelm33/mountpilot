stderr_handling:
  
  apply-to-category-mount-command-line: histlist
  apply-to-category-mount-console: video
  apply-to-category-unmount-command-line: histlist
  apply-to-category-unmount-console: video
  apply-to-category-create-disk-file: histlist
  apply-to-category-create-disk-file-console: video
  apply-to-category-disk-op-command-line: histlist
  apply-to-category-disk-op-console: video
  apply-to-category-history: video
  apply-to-category-autosetup: video

  # Overriding the default templates with 'formatdisk' one
  #flashdisk:
  #  copy: formatdisk

  umntlazy_i:    
    copy: video

  mntpoint:
    prelude: |
    epilog: |
    step: |
      ===== ${CMDDSP}
      \n
      ${COMMENT}
      \n
      [small,title="${IMG_TITLE}"]
      ****
      ${POSTCMDDSP}
      \n
      image::{staticimgdir}/${SCREENSHOT_IMAGE}[role="image_page", width={exampleimagewidth_smallscreen}, title=\"${IMG_TITLE}\", align="center",link={staticimgdir}/${SCREENSHOT_IMAGE}]
      ****

  histlist:
    prelude: |
      .Usage for ${PLAN_TITLE}
      [source,bash]
      ----
      ${USAGE} 
      ----
      ${USAGE_INFO} 
      \n
      ifdef::large_screen[]
      [cols="30%,45%,25%", title="${PLAN_TITLE}"]
      |===
      | Sample command | Output | Comments
      \n
      endif::[]

    epilog: |
      ifdef::large_screen[]
      |===
      endif::[]

    step: |
      ifdef::large_screen[]
      a|
      [source,bash]
      ----
