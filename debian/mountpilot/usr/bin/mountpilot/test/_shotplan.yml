  formatdisk_i:
    _categories: ["disk-op-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Formatting a disk with the interactive console
    1:
      name: Example of formatting a exfat disk with the interactive console
      live-recording: yes
      pre-command: |
        rm ~/.config/Sumo/recentlist.yml
        echo > ~/.local/sumo/log.txt # Reset log for the test
      command : |
        gnome-terminal --geometry 0+0 --title="mountpilot"  --wait --command="bash -c 'mountpilot -y -H blank --ghost'"
      comment: |
          This example formats a blank USB key with an exfat partition. 
          The partition is mounted and browser is opened on mounted folder, which 
          should be empty. At the end, it is unmounted.
          precondition: plugin the big 8Go stick

  flashdisk_i:
    _categories: ["disk-op-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Flashing a disk with the interactive console
    1:
      name: Example of flashing a mini Debian image with the interactive console
      live-recording: yes
      pre-command: |
        rm ~/.config/Sumo/recentlist.yml
        echo > ~/.local/sumo/log.txt # Reset log for the test
      command : |
        gnome-terminal --geometry 0+0 --title="mountpilot"  --wait --command="bash -c 'mountpilot -y -H blank --ghost'"
      comment: |
          The image debian_20070703T000000Z_mini.iso is flashed on stick via the console, typing 'F'.
          Default location folder of image is given in sumo's local config.
          Once flashed, the image is mounted and browsed typing 'b'.
          At the end, the stick is unmounted and content wiped off.
          Note: This example performs the same task as the one given for the command line example, but using
          the console menus and functionality. 
          precondition: plugin the big 8Go stick

  createencrypteddisk_i:
    _categories: ["create-disk-file-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Creating an encrypted device with the interactive console
    1:
      name: Example of creating a VERA-encrypted device with the interactive console
      live-recording: yes
      command : |
        echo > ~/.local/sumo/log.txt # Reset log for the test
        gnome-terminal --geometry 0+0 --title="mountpilot"  --wait --command="bash -c 'mountpilot -y -H blank --ghost'"
      comment: |
          This example creates a VERA volume hosted directly by the device, with password 'vera'.
          The VERA volume is created for containing a NTFS file system. 
          The volume is mounted to check if the password works.
          Its root folder opened with a file explorer to check the available space.
          At the end, the VERA volume is unmounted. Stick content is wiped off.
          precondition: plugin the stick dedicated for encrypted systems. 

    2:
      name: Example of creating a LUKS-encrypted device with the interactive console
      live-recording: yes
      command : |
        echo > ~/.local/sumo/log.txt # Reset log for the test
        gnome-terminal --geometry 0+0 --title="mountpilot"  --wait --command="bash -c 'mountpilot -y -H blank --ghost'"
      comment: |
          This example creates a LUKS volume hosted directly by the device, with password 'luks'.
          The LUKS volume is created for containing a NTFS file system. 
          The volume is mounted to check if the password works.
          Its root folder opened with a file explorer to check the available space.
          At the end, the LUKS volume is unmounted. 

  autossh_i: 
    _categories: ["autosetup", "manual"]
    _ignore-for-manpage: yes
    _title: |
      SSH auto-login setup
    1:
      name: Example of SSH auto-login setup carried out at first mount
      live-recording: yes
      #manual: yes
      command : |
        #sudo ip addr add ${TEST_HOST_1_IF_IP}/24 dev ${TEST_HOST_1_IF} || echo "${TEST_HOST_1_IF_IP} exists"
        #sudo ip route del 192.168.0.0/24 dev ${TEST_HOST_1_IF} || echo "192.168.0.0 already cleaned"
        #sudo ip route add ${TEST_HOST_1_IP}/24 dev ${TEST_HOST_1_IF} &>/dev/null || echo "Route exists"
        echo > ~/.local/sumo/log.txt # Reset log for the test
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot --ghost -y -H blank'"

        gnome-terminal --geometry 60x35+0+0 --title="testcontrol"  --wait --command="bash -c 'sleep 2 && sumo -s -y michel@${TEST_HOST_1_IP} && read -n1 -p \"Following the auto-SSH setup, then via interactive console, mount and unmount to check no pass is required anymore. Type 'q' to quit\" && exit 0'"

      post-command: |
        sudo ip addr del ${TEST_HOST_1_IF_IP}/24 dev ${TEST_HOST_1_IF}
      comment: |
          An attempt to mount via SSH is carried out on host ${TEST_HOST_1_IP} using login michel. 
          It is detected whether an auto-login is already out there. When not, the setup of the auto-login is followed. After the setup is done
          the remote folder is listed, the remote host is unmounted and remounted to check that the auto-login is in effect
          and no password is requested anymore.
          NOTE:
          Assign a local IP to the interface used to communicate with test host
            sudo ip addr add 192.168.0.31/24 dev enx000fc9119ecb
          On test machine, recreate user 'michel'
            sudo userdel -f michel
            sudo useradd michel -m 
            sudo passwd michel
            sudo ip addr add ${TEST_HOST_1_IP}/24 dev enp0s25 # Put the correct interface name

  autoftp_i: 
    _categories: ["autosetup", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Automatic FTP auto-login
    1:
      name: Example of automatic ftp auto-login setup carried out at first mount
      live-recording: yes
      #manual: yes
      pre-command: |
        rm -f ~/.netrc_ftp.slashetc.fr || echo ".netrc_ftp.slashetc.fr cleanup ok"
        rm -f ~/.netrc_riffian  || echo ".netrc_riffian cleanup ok"
        echo > ~/.local/sumo/log.txt # Reset log for the test
      command : |
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot -y -H blank --ghost'"

        gnome-terminal --geometry 60x35+0+0 --title="testcontrol"  --wait --command="bash -c 'sleep 3 && sumo -s -y ftp://${FTPLOGIN}@${FTPADDR} ~/webftp && read -n1 -p \"Now check content of mounted ftp folder. When ok, unmount it and press a key\" && sumo -s -y ftp://eng@192.168.0.12 ~/eng -p eng && read -n1 -p \"Now check content of mounted ftp folder. When ok, unmount it and press a key\" && sumo -s -y ftp://${FTPLOGIN}@${FTPADDR} ~/webftp && sumo -s -y ftp://eng@192.168.0.12 && read -n1 -p \"Now check that both ftp sites could be mounted with console without password. When ok, unmount them and press a key to finish\" && exit 0'"

      comment: |
          An attempt to mount a distant ftp site is carried out by command. The first time, the tester is requested to enter password.
          Upon successful login, the root folder is browsed and the ftp site is unmounted. The same process is repeated with
          another ftp site. At the end, we repeat the same process again for both sites. In both cases, it was not 
          necessary to re-enter the password.

  autonfsserverinstall_i: 
    _categories: ["autosetup", "manual"]
    _ignore-for-manpage: yes
    _title: |
      NFS server installation
    1:
      name: Example of automatic server installation when no NFS server is detected upon NFS URL mounting
      live-recording: yes
      #manual: yes
      pre-command: |
        # remove the point-to-point connection
        sudo ip route del ${TEST_HOST_1_IP} dev ${TEST_HOST_1_IF} 2>/dev/null  || echo

      command : |
        echo > ~/.local/sumo/log.txt # Reset log for the test
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot -y -H blank --ghost'"
        gnome-terminal --geometry 60x35+0+0 --title="testcontrol" --wait --command="bash -c 'sleep 3 && sumo -s -y 192.168.0.30:/home/michel && read -n1 -p \"Now check that the NFS mount appears in the console. Browse its content. Unmount and remount to check no password is requested. When ok, unmount them and press a key to finish\" && exit 0'"

      comment: |
          In this example, we go through the entire NFS setup process. We attempt to mount a NFS share on a remote 
          host where there is no NFS server. We let the installation proceed, then we agree to proceed with NFS export setup.
          Finally, the mounting is done and the content of the mounted folder is listed.
          The permission may be lacking for it, since the ID of user michel may not be the same.
          The folder is unmounted and remounted to check that the mounting runs smoothly with any new password entry.
          precondition:
            The test host must be connected on the same LAN, and not point-to-point anymore.
            The internet connetion shall also be established:
              put "nameserver 8.8.8.8" in /etc/resolv.conf
              sudo ip route add default via 192.168.0.254 dev enp0s25
              sudo ip addr add 192.168.0.30/24 dev enp0s25 # if done yet

            The SSH must have been installed via previous test 'autossh_i'

            ensure NFS packages are uninstalled 
                sudo apt remove nfs-*

            This did not help get the permissions:
            remote 'michel' account must be in sudoers' group: sudo usermod michel -G sudo
            sudo groupadd -g 2001 G2001

  autoftpserverinstall_i: 
    _categories: ["autosetup", "manual"]
    _ignore-for-manpage: yes
    _title: |
      FTP server installation
    1:
      name: Example of auto FTP server install when none is detected upon FTP mounting
      live-recording: yes
      #manual: yes
      command : |
        echo > ~/.local/sumo/log.txt # Reset log for the test
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot -y -H blank --ghost'"

        gnome-terminal --geometry 60x35+0+0 --title="testcontrol" --wait --command="bash -c 'sleep 3 && sumo -s -y ftp://michel@192.168.0.30 && read -n1 -p \"Now check that the FTP mount appears in the console. Browse its content. Unmount and remount to check no password is requested. When ok, unmount them and press a key to finish\" && exit 0'"

      comment: |
          In this example, we go through the entire FTP setup process. We attempt to mount a FTP site on a remote 
          host where there is no FTP server. We select 'vsftpd' for installation, then we agree to proceed with FTP password setup.
          Finally, the mounting is done and the content of the mounted folder is listed.
          The folder is unmounted and remounted to check that the mounting runs smoothly with any new password entry.
          precondition:
            The SSH must have been installed via previous test 'autossh_i'

            ensure vsftp* packages are uninstalled 
                sudo apt remove vsftp*

  autonfsexport_i: 
    _categories: ["autosetup", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Auto NFS exports setup
    1:
      name: Example of automatic NFS exports setup upon NFS URL mounting
      live-recording: yes
      #manual: yes
      command : |
        echo > ~/.local/sumo/log.txt # Reset log for the test
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot -y -H blank --ghost'"
        gnome-terminal --geometry 60x35+0+0 --title="testcontrol" --wait --command="bash -c 'sleep 3 && sumo -s 192.168.0.30:/home/michel && read -n1 -p \"Now check that the NFS mount appears in the console. Browse its content. Unmount and remount to check no password is requested. When ok, unmount them and press a key to finish\" && exit 0'"
      comment: |
          An attempt to mount a NFS share on a remote test host where the exports do not allow the mounting yet
          The NFS export setup is agreed and the NFS mounting eventually is successful.
          precondition:
          nfs server was installed in test 'autonfsserverinstall_i'. For the sake of this test,
          the /etc/exports file may just have to be removed:
            sudo su -
              echo > /etc/exports
              exit 
            sudo systemctl restart nfs-kernel-server

  umntlazy_i:
    _categories: ["unmount-console", "automatic"]
    _ignore-for-manpage: yes
    _title: |
      Lazy unmounting on broken mount
    1:
      name: Example of lazy unmounting on broken mount
      live-recording: yes
      command : |
        echo > ~/.local/sumo/log.txt # Reset log for the test
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot -y -H blank --ghost'"
        gnome-terminal --geometry 60x35+0+0 --title="testcontrol" --wait --command="bash -c 'sleep 3 && sumo -s 192.168.0.30:/home/michel && read -n1 -p \"Now unplug the ethernet cable and press 'u' to update the console. The broken NFS link should appear in red. Perform a lazy umount. If ok, press a key to finish\" && exit 0'"

      comment: |
          In the continuation of the previous test, the remote test host is mounted over NFS. 
          The ethernet cable is unplugged. The broken link appears in red and can be released
          through a lazy unmount. After the end of the test, plugin the cable again.

  formatdisk:
    _categories: ["disk-op-command-line", "automatic"]
    _term-height: 55
    _title: |
      Formatting a disk
    _usage:  |
          sumo -F -t <filesystem type> <block device path>
          sumo --format-disk -t <filesystem type> <block device path>
    1:
      name: Example of creating on disk a file system (ext4) located on a single partition
      pre-command: |
          cd ~/test_sumo
      command-display : 
      command : |          
          sumo -F -t ext4 /dev/${DISK_FORMAT_PART_FLASH_TEST} <<< 'n'
      post-command-display:
      post-command: |
          sumo -y /dev/${DISKPART_FORMAT_PART_FLASH_TEST} ./formatteddisk
          test -d formatteddisk && echo "Executing 'ls' on disk" && ls formatteddisk  
          sleep 2
          sumo -u formatteddisk
      comment: |
          When prompted, 'n' (no) is automatically entered to disable a partitionless formatting.
          The result is a single partition containing an ext4 file system.

    2:
      name: Example of creating an exfat disk without partition 
      pre-command: |
          cd ~/test_sumo
      command-display : 
      command : |          
          sumo -y -F -t exfat /dev/${DISK_FORMAT_PART_FLASH_TEST}
      post-command-display:
      post-command: |
          sumo -y /dev/${DISK_FORMAT_PART_FLASH_TEST} ./myexfat
          [ -d myexfat ] && touch myexfat/testfile.txt 
          test -d myexfat && echo "Executing 'ls' on disk" && ls myexfat  
          sleep 2
          sumo -u myexfat
      comment: |
          When prompted, 'y' (yes) is entered to enable partitionless formatting.
          The result is an exfat disk without partition. 
          A test file is written and its presence checked with 'ls'.
          Note that for mounting, the disk device path has to be used directly.
          precondition: plugin the big 8 Go stick

  partdisk:
    _categories: ["disk-op-command-line", "automatic"]
    _title: |
      Creating a disk partition
    _usage:  |
          sumo --part-disk=<partition GUID> <block device path>
          sumo -P <partition GUID> <block device path>
    1:
      name: Example of creating a single partition of type Microsoft Basic data partition
      pre-command: |
          cd ~/test_sumo
      command-display :
      command : |          
          sumo -y -P EBD0A0A2-B9E5-4433-87C0-68B6B72699C7 /dev/${DISK_FORMAT_PART_FLASH_TEST}
      post-command-display:
      post-command: |
          sync && sleep 2
          test "$(lsblk -n -o parttype /dev/${DISKPART_FORMAT_PART_FLASH_TEST})" = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7" && echo "OK, /dev/${DISKPART_FORMAT_PART_FLASH_TEST} part is 'Microsoft Basic data'" || echo "NOT OK,  /dev/${DISKPART_FORMAT_PART_FLASH_TEST} part UUID is ${partdisk_parttype}"
      comment:

  flashdisk:
    _categories: ["disk-op-command-line", "automatic"]
    _term-height: 40
    _title: |
      Flashing a disk
    _usage: |
          sumo --flash-disk=<disk image> <block device path>
          sumo -B <disk image> <block device path>
    1:
      name: Example of flashing a Linux installation image
      pre-command: |
          cd ~/test_sumo
      command-display : 
      command : |          
          sumo -y -B ~/riffian/Data/Softlib/images\ iso/mini.iso /dev/${DISK_FORMAT_PART_FLASH_TEST}
      post-command-display:
      post-command: |
          sleep 2
          sumo -y -L CDROM
          test -d CDROM && echo "Executing 'ls' on disk" && ls CDROM  
          sleep 2
          sumo -u -L CDROM
      comment: |
          This example flashes a mini installation image of Debian labeled 'CDROM'. 
          Flashing the image results in the creation of an ISO9660 file system which content can be mounted.

  createimg:
    _categories: ["create-disk-file"]
    _term-height: 50
    _ignore-comment-for-manpage: yes
    _title: |
      Creating a raw disk image file
    _usage: sumo [OPTIONS] <disk file name>.img [target folder]
    1:
      _categories: ["automatic"]
      name: Example of creating a raw disk image file with a 1Mo ext2, no prompting
      pre-command: |
          cd ~/test_sumo
          mkdir newdiskfiles 2>/dev/null || echo "Folder newdiskfiles already exists." 
          cd newdiskfiles
      command-display : |
          sumo [-L <label>] -o size=<size> [-t <filesystem name>] <file name>.img 
      command : |        
          sumo -y rawdisk.img -o size=1M -t ext2
      post-command-display:
      post-command: |
          sleep 1
          [ -d rawdisk ] && touch rawdisk/testfile.txt 
          test -d rawdisk && echo "Executing 'ls'" && ls rawdisk
          sleep 1
          sumo -u rawdisk.img
          sleep 1
          rm rawdisk.img
          cd ../..
      comment: |
          A raw disk image is created hosting an 'ext2' file system. 
          The image is mounted, a test file is written before its content inspected with 'ls', eventually unmounted.

    2:
      _categories: ["manual"]
      name: Example of creating a raw disk image file with default ext4 and entered size 900K
      pre-command: |
          cd ~/test_sumo
          mkdir newdiskfiles 2>/dev/null || echo "Folder newdiskfiles already exists." 
          cd newdiskfiles
      command-display : |
          sumo [-L <label>] -o size=<size> [-t <filesystem name>] <file name>.img 
      command : |        
          sumo -y rawdisk.img
      post-command-display:
      post-command: |
          sleep 1
          [ -d rawdisk ] && touch rawdisk/testfile.txt 
          test -d rawdisk && echo "Executing 'ls'" && ls rawdisk
          sleep 1
          sumo -u rawdisk.img
          sleep 1
          rm rawdisk.img
          cd ../..
      comment: |
          A raw disk image is created hosting a default 'ext4' file system.
          The size 900K is entered manually. 
          The image is mounted, a test file is written before its content inspected with 'ls', eventually unmounted.

  createvera:
