# the following ways depending on the option passed to the plan processor shotplan.sh:
#
# - without any option among those described below:
#        For generating document parts for the online documentation 
#        and generating test reports.
#        An individual plan or a set of plans of a given category or 'all' can be selected.
#
# - with option '-T|no-report': 
#        For running tests only, part of them being automatic and other manual.
#        An individual plan or a set of plans of a given category or 'all' can be selected.
#
# - with option '-M|--manpage' :
#        For generating the example lines for the manpage
#
# - with option '--cat' :
#        List available categories
#
#
#  When the tests are run to generate document parts and imags, shotplan must run
#  on the host where the images are stored. The following parameters shall be valid
#  path on the target host where the tests are run:
#
#  image_folder
#  image_folder2
#  output-dir
#
# ------------------------------------------------------------------------------
#
# Report bugs to michel.mehl@slashetc.fr
#
###############################################################################

#
#
# TODO when generating for online the name of the category shall be generated instead of the chapter name
# make a mapping between logical category names and readable names
#
#

# To find window is, type 'wmctrl -lp' and search the windows with matching title
application: mountpilot
release: yes
lang: "EN.US.UTF-8"
window_id: "0x026055ae"
image_folder: /home/michel/siteweb/products/images/mountpilot/
image_folder2: /home/michel/siteweb.output/output/products/images/bank/original/static/
output-dir: /home/michel/siteweb/products/pages/mountpilot/shotplan

term-height: 30
term-width: 110
environment: |

  - Ensure this test is being run on a dedicated, new terminal to the test running. 
  - NOTE: Term must have been opened at last. Finding of Window Id for screenshot depends on it

  - Ensure the following sticks are inserted (in that order):

     /dev/sdb : Big 8 Go stick:  rewritable usb stick e.g. used for flashing and formating disk
     /dev/sdc,/dev/sdc1 : SanDisk 16 Go : read-only photos stick. Stick named :'photos', 
     /dev/sdd,/dev/sdd1 : 'Repair 32 bits' stick reserved for encrypted volumes, may be rewritable. 

  - when not testing interactive mode, run mountpilot in ghost mode in a separate terminal 
    to check if data sources appear properly in mounted item list and history.
    It can also be used to create encrypted USB stick needed for the tests
   
  - Setup the local_test_vars.sh located inside the <sumo install dir>/test. This sets up local parameters:
    * local ethernet interface name used to connect with windows host
    * Address and credentials of the FTP site used for the test of the FTP mounting
  
  - Before starting history test, unmount and unplug the above listed sticks
    + adb device to save space at the screen bottom
  - If tests need to be adapted, they can be run manually, optionally from a start plan:

    source "$HOME/sumodev/test/local_test_vars.sh" # Set your own local sumo dir path here
    gnome-terminal --geometry 150x50+0+0 --title="mountpilot"  --wait --command="bash -c 'source ${SUMO_TEST_DIR}/local_test_vars.sh && shotplan.sh ${SUMO_TEST_DIR}/_shotplan.yml --force-defaults -C all -y -i --from=switchhist'"

  - Preexisting disk image files must exist and have been created before inside ~/test_sumo: 
    imgdisk.img
    imgdisk.qcow2 containing a file 'file.txt'
    veradisk.vera with a file 'test.txt'

pretest-script: pretest.sh
postest-script: posttest.sh

shotplan:
  list:
    _categories: ["mount-command-line", "automatic"]
    _ignore-comment-for-manpage: yes
    _information: |
      Before running the 'list' tests, ensure the following environment is set:
      - there's an adb device connected ('adb devices' reports a valid device)
      - there's a docker container running, e.g. 
        sudo docker run --mount type=bind,src=/home/michel/,dst=/home/michel -it ubuntu bash
    _term-height: 30
    _term-width: 110
    _title: |
      Examples of list commands
    1:
      name: Default List (everything but loop devices and docker overlays)
      command : |
          sumo -l
      comment: |
          Here the list shows up the SSD of the running laptop (SATA interface) mapped to system device `/dev/sda` and 
          a connected USB key mapped to `/dev/sdb`. 

          The SDD features a dual boot system containing of 5 partitions, where Windows is installed on 2nd, 3rd and 4th partitions, and Linux on 5th (/dev/sda5).
          
          The Windows data partition and Linux partitions are labeled resp. `WINDOWS11` and `UBUNTU20-dell`
          
          The USB key is labeled `Boot-Repair-Disk 64bit`.

    2:
      name: List all except loop devices
      command : |
          sumo -l noloop
      comment: |
          This example is highlighted only for demonstration purposes to show what executes the default list. 
    3:
      name: List only real disks
      command : | 
          sumo -l disk
      comment: |
        The list here shows only the actual disks, i.e. the SSD of the running laptop (SATA interface) and the USB key as described
        in the first example.
    4:
      name: List only NTFS partitions
      command : | 
          sumo -l ntfs
      comment: |
    5:
      name: List by searching the string 'adb'.
      command : | 
          sumo -l adb
      comment: | 
        This example highlights how to list data sources which file system name or/and location string contains the string 'adb'.
    6:
      name: List all available data sources incl. loop
      _term-width: 120 
      _term-height: 57      
      command : | 
          sumo -l all
      comment: |
        This example highlights how to list absolutely all available data sources of any type, inclusive loop devices.
    7:
      name: Default list using the 'bgcolor' display format
      command : | 
          sumo -l --display-format=bgcolor
      comment: |
    8:
      name: Default list using the 'color' display format
      command : | 
          sumo -l --display-format=color
      comment: |

  mntpoint:
    _categories: ["destination-mount-folder"]
    _ignore-for-manpage: yes
    _title: |
      Usage for destination mount folders
    1:
        name: Mounting on an existing folder
        pre-command-display: 
        pre-command: |
            mkdir ~/test_sumo/photosDir || echo "~/test_sumo/photosDir  already exists"
            echo hello >  ~/test_sumo/photosDir/hellofile.txt
        command-display : |
            Folder already exists
        command : |
            sumo -L photos ~/test_sumo/photosDir
        post-command-display: 
            Here mounting a USB key labeled 'photos' on the existing folder ~/test_sumo/photosDir created by this test beforehand.
        post-command: |
            ls  ~/test_sumo/photosDir
            sleep 2
            sumo -u -L photos 
            rm -r  ~/test_sumo/photosDir
        comment: |
            When mounting on an existing folder which is not empty, the mounted content will mask the previous content and not change it.
    2:
        name: Mounting on a non-existing folder
        pre-command-display:
        pre-command:
        command-display : |
            Folder does not exist
        command : |            
            cd  ~/test_sumo/
            sumo -y -L photos
        post-command-display: | 
          Here mounting a USB key labeled 'photos'. The default mount folder name is 'photos' and 
          is automatically created thanks to the `-y` option.
        post-command: |
            ls ./photos # We known the device was labeled 'photos'
            sleep 2
            sumo -u -L photos 
        comment: |
            When mounting on a folder which does not exit yet, a default one is proposed in the current working directory as follows:

                * If a label is associated with the data source, a folder which the name is the label

                * In absence of any label, a folder holding the name of the last path component of the data source (e.g. `sdc1` when device is `/sdc/sdc1`)

            The user accepts the default value by typing {enterkey} or by entering a name of its own.

            If option `-y` is specified, the folder is created automatically using default value without prompting the user.

    3:
        name: Mounting on a folder which the data source is already mounted on
        pre-command-display:
        pre-command:
        command-display : |
            Data source already mounted on the same folder
        command : |
            cd  ~/test_sumo/
            sumo -s -y -L photos
            sleep 1
            sumo -s -y -L photos
        post-command-display: |
          Here mounting twice the USB key labeled 'photos' using the proposed default value.
          At the end, the two mounts are removed (unmounted) using option `-a`.
        post-command: |
            ls ./photos
            ls ./photos:1
            sleep 2
            sumo -a -u -L photos
        comment: |
            When mounting on an existing folder which is the same data source is already mounted on, 
            the default proposed destination folder will be supplemented with an index.

  mntlabel:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting using a system label
    _usage: "sumo [OPTIONS] -L|--label= <volume label> [<mount folder>]"
    1:
      name: Example of mounting by system label
      command : |
          sumo -y -L photos ./photosDir
      post-command-display: 
      post-command: |
          ls ./photosDir
          sleep 2
          sumo -u -L photos
      comment: |
          An USB stick labeled 'photos' is mounted on the folder 'photosDir' and its content listed. 
          At the end, the device is unmounted using the label as well.

  mntro:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a data source read-only
    _usage: sumo [OPTIONS] -o ro <data source> [<mount folder>]
    1:
      name: Example of mounting a data source read-only
      command : |
          sumo -o ro -y -L photos ./photosDir
      post-command-display: 
      post-command: |
          ls ./photosDir
          touch photosDir/stick_should_not_be_writable.txt 2>/dev/null || echo "OK, test file could not be written"
          sleep 2
          sumo -u -L photos
      comment: |
          A USB stick labeled 'photos' is mounted read-only on the folder 'photosDir'. 
          When the USB stick source is listed after its mounting, the round 'forbidden' symbol is shown.
          An attempt is made to write a file on it, which must not succeed.

  mntblk:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a block device
    _usage: sumo [OPTIONS] <block device path> [<mount folder>]
    1:
      name: Example of mounting of a block device
      command : |
          sumo -y /dev/sdb ./DebianInstall
      post-command-display: 
      post-command: |
          ls ./DebianInstall
          sleep 2
          sumo -u /dev/sdb 
      comment: |
          An USB key contains a flashed image of a Debian installation image.
          There is no partition. The stick is mounted and its content listed. 
          At the end, the device is unmounted using the device path.

  mntpart:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a partition
    _usage: sumo [OPTIONS] <partition device path> [<mount folder>]
    1:
      name: Example of mounting of a partition
      command : |
          sumo -y /dev/sdc1 ./photosDir
      post-command-display: 
      post-command: |
          ls ./photosDir
          sleep 2
          sumo -u /dev/sdc1 
      comment: |
          An USB key which partition is mapped to device `/dev/sdc1` is mounted on the folder 'photosDir'. 
          The content folder is listed. At the end, the device is unmounted using the device path.

  mntoverlay:
    _categories: ["mount-command-line", "automatic"]
    _term-height: 50
    _title: |
      Mounting an overlay file system
    _usage: sumo [OPTIONS] <overlay path> [<mount folder>]
    _usage-info: |
      where `<overlay path>` is of the form: _upper_dir_>__lower_dir__  +
      where the upper directory and the lower directory are separated by '>'. +
      When there are multiple lower dirs, the lowest is always put at the right most position and all dirs are separated by '>' as well. 
    1:
      name: Example of mounting of an overlay file system
      pre-command-display:
      pre-command: |
        pushd ~/test_sumo/overlay &> /dev/null
        mkdir demoLowerDir || echo "demoLowerDir exists" &> /dev/null
        echo -n "File of the lower FS" > demoLowerDir/lowerdir_file.txt
        mkdir demoUpperDir || echo "demoLowerDir exists" &> /dev/null
        echo -n "File of the upper FS" > demoUpperDir/upperdir_file.txt
      command-display : |
       sumo "<upperdir>><lowerdir>[><lowerdir>]*" [target folder]
      command : |
        sumo -y 'demoUpperDir>demoLowerDir' overlayDir
      post-command-display: 
      post-command: |
        echo -n "Changed file for overlay" > overlayDir/lowerdir_file.txt
        echo -n "Changed file for overlay" > overlayDir/upperdir_file.txt
        ls overlayDir/
        sleep 1
        sumo -u 'demoUpperDir>demoLowerDir'
        echo "Testing lowerdir file content (lowerdir_file): $(cat demoLowerDir/lowerdir_file.txt)"
        test "$(cat demoLowerDir/lowerdir_file.txt)" = "File of the lower FS"
        echo "Testing upperdir file content (upperdir_file): $(cat demoUpperDir/upperdir_file.txt)"
        test "$(cat demoUpperDir/upperdir_file.txt)" = "Changed file for overlay"

        sumo -y 'demoUpperDir>demoLowerDir' overlayDir
        echo "Testing lowerdir file content (lowerdir_file): $(cat overlayDir/lowerdir_file.txt)"
        test "$(cat overlayDir/lowerdir_file.txt)" = "Changed file for overlay"
        echo "Testing upperdir file content (upperdir_file): $(cat overlayDir/upperdir_file.txt)"
        test "$(cat overlayDir/upperdir_file.txt)" = "Changed file for overlay"
        sleep 1
        sumo -u 'demoUpperDir>demoLowerDir'

        popd &> /dev/null
      comment: |
        An overlay FS is created where 'demoUpperDir' is the overlaying upper dir and 'demoLowerDir' the overlaid lower dir.
        Both files 'lowerdir_file.txt' of the lower dir and 'upperdir_file.txt' of the upper dir are modified.
        After unmounting, it is checked that the file of the upper dir holds
        the modifications, whilst the file of the lower dir is unchanged.
        After remounting, it is checked that the files of the mounted overlay dir 
        still contains the modifications.

  mntadb:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting an Android device via adb
    _usage: sumo [OPTIONS] adb://usb [<mount folder>]
    _usage-info: |
       TODO exlain prerequesites
    1:
      name: Example of mounting an Android device via adb
      command-display : |
          sumo adb://usb
      command : |
          sumo -y adb://usb  ~/test_sumo/adb
      post-command-display: 
      post-command: |
          ls ~/test_sumo/adb
          sleep 7 # a delay is required because there may be some latency
          sumo -u ~/test_sumo/adb
      comment: |
          An Android tablet is mounted on folder '~/test_sumo/adb'.
          The folder content is listed. At the end, the folder is unmounted.

  mntnfs:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a NFS shared directory
    _usage: sumo [OPTIONS] <NFS URL> [<mount folder>]
    _usage-info: |
      where `<NFS URL>` is of the form: nfs://_host_:__remote directory path__ +
      The client-side and server-side *NFS mount options* can be controlled by *configuration*. See section <<NFS setup and mount options>>
    1:
      name: Example of mounting of a NFS shared directory
      command-display : |
          sumo [nfs://]<host>:<dirpath> [target folder]
      command : |
          sumo -y 192.168.0.12:/home/michel testNFSDir
      post-command-display: 
      post-command: |
          ls testNFSDir/mnt
          sumo -u testNFSDir
      comment: |
          The remote home of another host is mounted on folder 'testNFSDir'.
          The folder content of remote 'mnt' folder is listed.
          At the end, the NFS share is unmounted using the mounted folder itself.

  mntssh:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a remote directory via SSH
    _usage: sumo [OPTIONS] <SSH URL> [<mount folder>] 
    _usage-info: |
      where `<SSH URL>` is of the form: [ssh://]_login_@_host_[:_port_] +
      The client-side *SSHFS mount options* can be tuned by *configuration*. See section <<SSH setup and mount options>>
    1:
      name: Example of mounting of remote directory via SSH
      command-display : |
          sumo [ssh://]<login>@<host>:[<port>]/<path> [target folder]
          or
          sumo <login>@<host>[:<path>] [target folder]
      command : |
          sumo -y ${SSHLOGIN}@${SSHHOST}:. testRemoteDirSSH
      post-command-display: 
      post-command: |
          ls testRemoteDirSSH/mnt
          sumo -u testRemoteDirSSH
      comment: |
          The remote home of another host is mounted on folder 'testRemoteDirSSH'.
          The folder content of remote 'mnt' folder is listed.
          At the end, the SSH folder is unmounted. 

  mntsmb:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a Windows share
    _usage: sumo [OPTIONS] <SAMBA URL | UNC address> [<mount folder>]
    _usage-info: |
      where `SAMBA URL` is of the form: smb://[_login_:[_password_]@]_host_/_share_ +
      where `UNC address` is of the form: //_host_/_share_
    1:
      name: Example of mounting of remote Windows share
      pre-command: |
          sudo ip route add ${TEST_HOST_1_IP} dev ${TEST_HOST_1_IF} &>/dev/null || echo "Route exists"
      command-display : |
          sumo smb://<host>[/<login>[:password]][/<share>]] [target folder]
          or 
          sumo //<host>/<share> [target folder]
      # When a direct connection is used, don't forget to set the route!
      # Eg: sudo ip route  add 192.168.0.30 dev ${TEST_HOST_1_IF}
      command : |
          !sumo -y //${TEST_HOST_1_IP}/michel --user=michel --password=${TEST_HOST_1_PASS} ~/windows/
      post-command-display:
      post-command: |
          ls ~/windows/AppData
          sleep 1
          !sumo -u ~/windows
          sleep 1
          sudo ip route del ${TEST_HOST_1_IP} dev ${TEST_HOST_1_IF} 2>/dev/null  || echo
      comment: |
          The home of the remote Windows host ${TEST_HOST_1_IP} is mounted on folder 'windows'.
          The folder content of remote 'AppData' is listed.
          At the end, the Windows share is unmounted. 

  mntftp:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a FTP directory
    _usage: sumo [OPTIONS] <FTP URL> [<mount folder>] 
    _usage-info: |
      where `FTP URL` is of the form: ftp://[_login>@]_host_[:_port_] [target folder]

      If password is not given, the user will be prompted to enter one. If login is not specified in the URL, the current user login is used by default.

      The client-side *FTP mount options* can be tuned by *configuration*. See section <<FTP setup and mount options>>

    1:
      name: Example of mounting a FTP directory using login and password, no existing .netrc_${FTPADDR}
      pre-command: |
          rm -f $HOME/.netrc_${FTPADDR}
      command-display : |
          sumo ftp://[<login>@]<host>[:<port>] [target folder]
      command : |          
          !sumo -y ftp://${FTPLOGIN}@${FTPADDR} ~/webftp -p ${FTPPASS} 
      post-command-display:
      post-command: |
          sleep 1
          ls ~/webftp/download
          sleep 1
          sumo -u ~/webftp
      comment: |
          The FTP site ftp://${FTPLOGIN}@${FTPADDR} is mounted on folder 'webftp'.
          The 'download' folder content is listed.
          At the end, the FTP site is unmounted. 

    2:
      name: Example of remounting a FTP directory using existing .netrc_${FTPADDR} file
      command-display : |
          sumo ftp://[<login>@]<host>[:<port>] [target folder]
      command : |          
          !sumo -y ftp://${FTPLOGIN}@${FTPADDR} ~/webftp
      post-command-display:
      post-command: |
          sleep 1
          ls ~/webftp/download
          sleep 1
          sumo -u ~/webftp
      comment: |
          The FTP site ftp://${FTPLOGIN}@${FTPADDR} is mounted on folder 'webftp'
          using the credentials stored in .netrc_${FTPADDR} that should have 
          been generated in previous test.
          The 'download' folder content is listed.
          At the end, the FTP site is unmounted. 

  mntdrive:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting Google Drive
    _usage: sumo [OPTIONS] http://drive.google.com [<mount folder>] 
    _usage-info: |
      The default mount options can be tuned by configuration. See section <<Google Drive setup and mount options>>
      The test
    1:
      name: Example of mounting Google Drive
      command-display : |
          sumo <HTTP URL> [target folder]
      command : |          
          sumo -y https://drive.google.com drive
      post-command-display:
      post-command: |      
          ls drive/
          sleep 3
          sync
          sumo -u drive
      comment: |
          The Google Drive is mounted on folder 'drive'.
          The folder content is listed.
          At the end, the drive is unmounted.
          Preconditions:
          [1] The Google secrets have been pregenerated and put in configuration file ~/.config/Sumo/sumo.yml:
          ...
          google client id: 637374942720-uct976icvfcq8emmsfrdujd35j40pd8q.apps.googleusercontent.com
          google secret id : <<INTENTIONALLY MASKED SECRET ID>>
          [2] The following must be executed then to verify the credentials, 
          the user will be asked to verify twice:
             sumo -y https://drive.google.com drive --refresh-deps
             sumo -u ./drive # if successfull verification

    _DEPRECATED:
      name: Example of mount including verification of a new or changed OAuth client ID and secret ID
      command-display : |
          sumo <HTTP URL> [target folder] --refresh-deps
      command : |          
          sumo -y https://drive.google.com drive --refresh-deps
      post-command-display:
      post-command: |      
          ls drive/
          sleep 3
          sync
          sumo -u drive
      comment: |
          The Google Drive is mounted on folder 'drive' and its content is listed.
          Option `--refresh-deps` requests the OAuth client ID and secret ID to be verified beforehand.
          At the end, the drive is unmounted. 

  mntimg:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a raw disk image
    _usage: sumo [OPTIONS] <disk file name>.img [target folder]  
    1:
      name: Example of mounting of an existing raw disk image
      pre-command:
          cd ~/test_sumo
      command : |          
          sumo -y imgdisk.img ./imgdisk
      post-command-display:
      post-command: |
          ls imgdisk/
          sumo -u ./imgdisk
          cd ..
      comment: |
          The raw disk image is mounted on folder 'imgdisk'.
          The folder content is listed.
          At the end, the disk file is unmounted. 
          precondition: ~/test_sumo/imgdisk.img exists

  mntvm:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a virtual machine disk
    _usage: sumo [OPTIONS] <disk file name>.(qcow2|vdi) [target folder]  
    1:
      name: Example of mounting of an existing virtual machine disk
      pre-command:
          cd ~/test_sumo
      command : |          
          sumo -y imgdisk.qcow2 ./imgdisk_qcow2
      post-command-display:
      post-command: |
          ls imgdisk_qcow2/
          sumo -u ./imgdisk_qcow2
      comment: |
          The virtual disk image is mounted on folder 'imgdisk_qcow2'.
          The folder content is listed.
          At the end, the disk file is unmounted. 
          precondition: ~/test_sumo/imgdisk.qcow2 exists

  mntvera:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting an existing VERA volume
    _usage: |
      sumo [OPTIONS] <disk file name>.vera [target folder]  
      sumo [OPTIONS] <block device> [target folder]
    1:
      name: Example of mounting of a VERA volume which is a file 
      pre-command:
          cd ~/test_sumo
      command : |          
          sumo -y veradisk.vera ./veravol -p a
      post-command-display:
      post-command: |
          ls veravol/
          sleep 2 # If dashboard is running in parallel let time to refresh and update recent files
          sumo -u ./veravol
          cd ..
      comment: |
          The VERA disk file is mounted on folder 'veravol'.
          The folder content is listed.
          At the end, the disk file is unmounted. 
          precondition: ~/test_sumo/veradisk.vera exists

    2:
      input: 
        VERA_DEVICE: "Prepare the VERA stick, then enter VERA partition device path (e.g. sdc1 or sdd1)"
      name: Example of mounting of an existing VERA volume hosted on a device 
      pre-command:
          cd ~/test_sumo
      command : |          
          sumo -y /dev/${VERA_DEVICE} ./veravol -p a
      post-command-display:
      post-command: |
          ls veravol/
          sleep 2 # If dashboard is running in parallel let time to refresh and update recent files
          sumo -u ./veravol
      comment: |
          The VERA volume hosted on the device /dev/${VERA_DEVICE} (USB stick) is mounted on folder 'veravol'.
          The folder content is listed.
          At the end, the device is unmounted. 
          precondition: the test stick can be formatted as VERA as follows:
          - open mountpilot console,
          - select stick device
          - type 'f', 
          - select 'vera', <enter>
          - partitionless? enter 'NO' , <enter>
          - then select 'ext4' as file system, <enter>
          - enter and confirm password 'a', <enter>

  mntluks:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a LUKS volume
    _usage: |
      sumo [OPTIONS] <disk file name>.luks [target folder]  
      sumo [OPTIONS] <block device> [target folder]
    1:
      name: Example of mounting of an existing LUKS volume which is a file 
      pre-command:
          cd ~/test_sumo
      command : |          
          sumo -y luksdisk.luks ./luksdisk -p a
      post-command-display:
      post-command: |
          ls luksdisk/
          sleep 2 # If dashboard is running in parallel let time to refresh and update recent files
          sumo -u ./luksdisk
          cd ..
      comment: |
          The LUKS disk file is mounted on folder 'luksdisk'.
          The folder content is listed.
          At the end, the disk file is unmounted. 
          precondition: ~/test_sumo/luksdisk.luks exists

    2:
      name: Example of mounting of an existing LUKS volume hosted as a partition of a device 
      input: 
        LUKS_DEVICE: "Prepare the LUKS stick, the enter LUKS partition device path (e.g. sdc1 or sdd1)"
      pre-command:
          cd ~/test_sumo
      command : |          
          sumo -y /dev/${LUKS_DEVICE} ./luksdisk -p a
      post-command-display:
      post-command: |
          ls luksdisk/
          sleep 2 # If dashboard is running in parallel let time to refresh and update recent files
          sumo -u ./luksdisk
          cd ..
      comment: |
          The LUKS volume hosted on the device /dev/${LUKS_DEVICE}  (USB stick) is mounted 
          on folder 'luksdisk' and its content is listed. At the end, the device is unmounted. 
          precondition: the test stick can be formatted as LUKS as follows:
          - open mountpilot console,
          - select stick device
          - type 'f', 
          - partitionless? enter 'NO' , <enter>
          - select 'LUKS', 'partitionless' , <enter>
          - then select 'ext4' as file system, <enter>
          - enter and confirm password 'a', <enter>

  mntnested:
    _categories: ["mount-command-line", "automatic"]
    _title: |
      Mounting a nested data source
    _term-height: 50
    _usage: |
          sumo [OPTIONS] <data source> [target folder]
          sumo [OPTIONS] <target folder>/.../<data source2> [target folder 2]
          ...
    1:
      name: Example of mounting a nested data source
      pre-command:
      command : |          
          sumo -y -L WINDOWS11 ~/WINDOWS11
          sumo -y ~/WINDOWS11/Users/miche/Documents/vault/personnel-confidentiel.vera ~/vault # /dev/sda3
      post-command-display:
      post-command: |
          ls ~/vault/
          sleep 2 # If dashboard is running in parallel let time to refresh and update recent files
          sumo -y -f -u ~/WINDOWS11
          cd ..
      comment: |
          There's a VERA volume file located on a Windows partition labeled 'WINDOWS11' (/dev/sda3). 
          First the Window partition is mounted, then the VERA volume located inside it.
          At the end, the Windows partition is unmounted. 
          Because sumo is aware of nested mounts, it will request to confirm
          the unmounting of the nested VERA volume as well. 
          The confirmation is entered automatically here using both the `-y` and `-f` options. Note for the sake of safety
          specifying only `-y` is not enough in this specific case.

  mntlvm:
    _categories: ["mount-command-line", "automatic"]
    _term-height: 50
    _title: |
      Mounting LVM volumes
    _usage: |
          sumo [OPTIONS] <data source> [target folder]
    1:
      name: Example of mounting of LVM volumes
      pre-command:
      command : |          
          sumo -y ~/riffian/Data/Machines/backuprepo-amd64.qcow2 ~/vmdisk || echo "Normal failure, as swap cannot be mounted"
      post-command-display:
      post-command: |
          ls ~/vmdisk/
          sleep 2 # If dashboard is running in parallel let time to refresh and update recent files
          sumo -a -u ~/riffian/Data/Machines/backuprepo-amd64.qcow2
      comment: |
          The data source is here a full Debian9 VM disk that has been partitionned with LVM.
          The disk contains several LVM volumes which are mounted all together. 
          Note that device nbd0p2 cannot be mounted because it is a swap partition.
          Once mounted, its content is listed.
          At the end, the whole disk and all LVM volumes are unmounted all at once.
          Regarding the unmount, please check also section <<Unmounting LVM volumes>>.

