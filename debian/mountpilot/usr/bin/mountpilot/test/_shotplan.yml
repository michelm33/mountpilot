  partdisk_i:
    _categories: ["disk-op-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Creating a disk partition with the interactive console
    1:
      name: Example of creating a disk partition with the interactive console
      live-recording: yes
      pre-command: |
        rm ~/.config/Sumo/recentlist.yml
        echo > ~/.local/sumo/log.txt # Reset log for the test
