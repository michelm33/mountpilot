  umnt_src:
    _categories: ["unmount-command-line", "automatic"]
    _title: |
      Unmounting using the data source location      
    _usage: |
        sumo -u <block device>
        sumo -u <overlay path>         
        sumo -u adb://usb
        sumo -u [nfs://]<host>:<dirpath>
        sumo -u ftp://[<login>@]<host>[:<port>]
        sumo -u [ssh://]<login>@<host>:[<port>]/<path>
        sumo -u <login>@<host>[:<path>]
        sumo -u smb://<host>[/<login>[:password]][/<share>]]
        sumo -u //<host>/<share>
        sumo -u <HTTP URL>
        sumo -u <disk file name>
    1:
      name: Example of unmounting using the NFS URL
      command-display :
      pre-command: |
          sumo -s -y riffian:/home/michel/Data/Scan ~/mnt/scanDir 
          ls ~/mnt/scanDir 
          sleep 1 
      command : |          
          sumo -s -u riffian:/home/michel/Data/Scan
      post-command-display:
      post-command: |
          test -d ~/mnt/scanDir || echo "OK, checked that mount folder was removed"
      comment: 
    2:
      name: Example of unmounting using the SSH URL
      command-display : 
      pre-command: |
          sumo -s -y ${SSHLOGIN}@${SSHHOST}:Data/Scan ~/mnt/scanDir 
          ls ~/mnt/scanDir 
          sleep 1 
      command : |          
          sumo -s -u ${SSHLOGIN}@${SSHHOST}:Data/Scan 
      post-command-display:
      post-command: |
          test -d ~/mnt/scanDir || echo "OK, checked that mount folder was removed"
      comment: |
    3:
      name: Example of unmounting using the UNC address
      command-display :
      pre-command: |
          sudo ip route add ${TEST_HOST_1_IP} dev ${TEST_HOST_1_IF} 2>/dev/null || echo 
          !sumo -s -y //${TEST_HOST_1_IP}/michel --user=michel --password=${TEST_HOST_1_PASS} ~/mnt/windows/
          ls ~/mnt/windows/AppData
          sleep 1 
      command : |    
          !sumo -s -u //${TEST_HOST_1_IP}/michel  
      post-command-display:
      post-command: |
          test -d ~/mnt/windows || echo "OK, checked that mount folder was removed"
          sudo ip route del ${TEST_HOST_1_IP} dev ${TEST_HOST_1_IF} 2>/dev/null  || echo
      comment: |
    4:
      name: Example of unmounting using the FTP URL
      command-display :
      pre-command: |
          rm -f $HOME/.netrc_${FTPADDR}
          !sumo -s -y ftp://${FTPLOGIN}@${FTPADDR} ~/mnt/webftp -p ${FTPPASS}
          ls ~/mnt/webftp/download
          sleep 1 
      command : |    
          !sumo -s -u ftp://${FTPLOGIN}@${FTPADDR} 
      post-command-display:
      post-command: |
          test -d ~/mnt/webftp || echo "OK, checked that mount folder was removed"
      comment: |
    5:
      name: Example of unmounting using the Google Drive URL
      command-display :
      pre-command: |
          sumo -s -y https://drive.google.com ~/mnt/drive
          ls ~/mnt/drive/
          sleep 1 
      command : |    
          sumo -s -u https://drive.google.com 
      post-command-display:
      post-command: |
          test -d ~/mnt/drive || echo "OK, checked that mount folder was removed"
      comment: |
    6:
      name: Example of unmounting using VERA volume file
      command-display :
      pre-command: |
          cd ~/test_sumo
          sumo -s -y veradisk.vera ./veravol -p a
          ls ./veravol/
          sleep 1 
      command : |    
          sumo -s -u veradisk.vera 
      post-command-display:
      post-command: |
          test -d ./veravol || echo "OK, checked that mount folder was removed"
          cd ..
      comment: |
    7:
      name: Example of unmounting using LUKS volume file
      command-display : 
      pre-command: |
          cd ~/test_sumo
          sumo -s -y luksdisk.luks luksdisk -p a
          ls luksdisk/
          sleep 1 
      command : |    
          sumo -s -u luksdisk.luks
      post-command-display:
      post-command: |
          test -d luksdisk || echo "OK, checked that mount folder was removed"
          cd ..
      comment: |
    8:
      name: Example of unmounting using a virtual machine disk file
      command-display : 
      pre-command: |
          cd ~/test_sumo
          sumo -s -y imgdisk.qcow2 ./imgdisk_qcow2
          ls imgdisk_qcow2/
          sleep 1 
      command : |    
          sumo -s -u imgdisk.qcow2 
      post-command-display:
      post-command: |
          test -d ./imgdisk_qcow2 || echo "OK, checked that mount folder was removed"
          cd ..
      comment: |
  
  umntlazy:
    _categories: ["unmount-command-line", "manual"]
    _term-height: 50
    _title: |
      Lazy unmounting
    1:
      name: Example of lazy unmounting
      pre-command-display: 
      pre-command: |
        rm ~/.local/sumo/log.txt
        sumo -y ${SSHLOGIN}@${SSHHOST}:. ~/mnt/testRemoteDirSSH
        sleep 2
        sumo -y -L photos ~/mnt/photosDir
        sleep 1
      command-display : |
          sumo -u --lazy <data source>
          sumo -u --lazy <mountpoint>
      command : |
        sumo --lazy -u ~/mnt/testRemoteDirSSH
        sumo --lazy -u -L photos 
      post-command-display: 
      post-command: |
        sync & sleep 1
        cat ~/.local/sumo/log.txt | grep 'UMOUNT COMMAND:'
      comment: |
          A local USB stick and remote SSH folder are mounted.
          Both sources are unmounted lazy. The logs are inspected to check manually that the native lazy options have been passed on.

  mntblk_i:
    _categories: ["mount-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Mounting a block device in interactive console
    1:
      name: Example of mounting of a block device
      live-recording: yes
      pre-command: |
        rm ~/.config/Sumo/recentlist.yml
        echo > ~/.local/sumo/log.txt # Reset log for the test
      command : |
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot --ghost'"
        gnome-terminal --geometry 60x35+0+0 --title="testcontrol"  --wait --command="bash -c 'read -n1 -p \"Insert now the stick and strike a key to remount using sumo\" && sumo -u /dev/sde1 && sleep 2 && sumo -o ro -s -y /dev/sde1 && cat ~/.local/sumo/log.txt && read -n1 -p \"Check the log, then typing b on the console to browse. Once done, type any key to unmount\" && sumo -u /dev/sde1 && read -n1 -p \"Check the device is unmounted. Type any key to exit this term. Type 'q' to quit the interactive console\" && exit 0'"
      comment: |
          An USB stick, which contains a Debian installation ISO image is first live plugged in.
          The stick is then remounted by sumo command read-only on the default folder by command line.
          On the console, the mounted device disappears and reappears. 
           ~/.local/sumo/log.txt is inspected, which indicates the device was actually mounted write-protected.
          After that the content of the stick is checked by browsing the mounted folder.          
          At the end, the device is unmounted.         

  mntpart_i:
    _categories: ["mount-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Mounting a partition
    1:
      name: Example of mounting of a partition
      live-recording: yes
      pre-command: |
        rm ~/.config/Sumo/recentlist.yml
        echo > ~/.local/sumo/log.txt # Reset log for the test
        sumo -u /dev/sda3
      command : |
        echo > ~/.local/sumo/log.txt # Reset log for the test
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot --ghost'"

        gnome-terminal --geometry 60x35+0+0 --title="testcontrol"  --wait --command="bash -c 'sleep 4 && sumo -s -y /dev/sda3 && cat ~/.local/sumo/log.txt && read -n1 -p \"Check the log, then typing b on the console to browse. Once done, type any key to unmount\" && sumo -u /dev/sda3 && read -n1 -p \"Check the device is unmounted. Type any key to exit this term. Type 'q' to quit the interactive console\" && exit 0'"
      comment: |
          A Windows data partition, which is mapped to device `/dev/sda3` on a dual boot system,
          is mounted on the proposed default folder.
          After that, the content of the Data partition is checked by browsing the mounted folder.          
          At the end, the partition is unmounted.

  mntro_i:
    _categories: ["mount-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Mounting a data source read-only
    1:
      name: Example of remounting an SSH read-only
      live-recording: yes
      pre-command: |
        rm ~/.config/Sumo/recentlist.yml
        echo > ~/.local/sumo/log.txt # Reset log for the test
      command : |
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot --ghost'"

        gnome-terminal --geometry 60x35+0+0 --title="testcontrol"  --wait --command="bash -c 'sleep 4 && sumo -s -y michel@riffian ./testsshro && read -n1 -p \"Now, remount read-only the ssh mounting on testsshro via the console. Then type b to check content is ro. Any key continue\" &&  read -n1 -p \"Unmount and remount from history and browse to check still read-only. Any key continue\" && read -n1 -p \"Remount r/w and check if writable. Any key to unmount and end \" && sumo -u ./testsshro && exit 0'"

      comment: |
          A SSH mount is set up, initially in read-write. The content is checked for being writeable with the browser.
          The SSH source is remounted read-only via the interactive console. The content is checked for being read-only with the browser.
          The SSH source is unmounted and mounted again from history to check that it remained read-only after remount.
          The SSH source is remounted from read-only back to read-write. The content is checked for being writeable with the browser.
          At the end, SSH connection is unmounted.

  mntremount_automountparent_i:
    _categories: ["mount-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Auto-mount of parent data source when remounting from history
    1:
      name: Example of remounting from history involving a parent data source to be remounted 
      live-recording: yes
      pre-command: |
        rm ~/.config/Sumo/recentlist.yml
        echo > ~/.local/sumo/log.txt # Reset log for the test
      command : |
        gnome-terminal --geometry 0+0 --title="mountpilot"  --wait --command="bash -c 'mountpilot --ghost'"
      comment: |
          A personal vault implemented as a LUKS disk file is located on a Windows partition which is not mounted. 
          When attempting to remount the disk file from history, it is proposed to remount automatically 
          the Windows partition containing the disk file.
          At the end, the Windows partition is unmounted, which automatically triggers the unmounting of the contained
          disk file as well.

  mntfwd_i:
    _categories: ["mount-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Mount forwarding with the interactive console
    1:
      name: Example of mount forwarding with the interactive console
      live-recording: yes
      command : |
        echo > ~/.local/sumo/log.txt # Reset log for the test
        gnome-terminal --geometry 0+0 --title="mountpilot"  --wait --command="bash -c 'mountpilot -y -H blank --ghost'"
      comment: |
          This example involves a USB stick containing a single partition and shows how the partition can be mounted 
          and unmounted by applying the mount order to the parent system device standing for the device itself.
          The mount operation is repeated directly on the partition itself to show that the result is all the same.

  histlist:
    _ignore-comment-for-manpage: yes    
    _title: |
      Listing available mount histories
    1:
      _usage: sumo -H
      name: Listing available mount histories
      pre-command-display: 
      pre-command: 
      command : |
          sumo -H
      post-command-display: 
      post-command: 
      comment: |
         This example shows that the available mount histories. For example, there's the 
         __demo__ one. The content of the __demo__ history is saved in the file named 
         __recent.yml.<history name>__ located in `~/.config/Sumo` folder. 

  sync_hist:
    _categories: ["history", "manual"]
    _ignore-for-manpage: yes    
    _title: |
      History synchronization between console and command lines
    1:
      name: Example of LVM disk unmounted from terminal and updated live in the history
      live-recording: yes
      pre-command: |
        rm ~/.config/Sumo/recentlist.yml
        echo > ~/.local/sumo/log.txt # Reset log for the test
      command : |
        gnome-terminal --geometry 30x30+600+0 --title="mountpilot" --command="bash -c 'mountpilot --ghost'"

        gnome-terminal --geometry 60x35+0+0 --title="testcontrol"  --wait --command="bash -c 'sleep 4 && sumo -s -y ~/riffian/Data/Machines/backuprepo-amd64.qcow2 ; read -n1 -p \"Check that the LVM qcow2 is mounted. Any key to continue and unmount\" && sumo -a -u ~/riffian/Data/Machines/backuprepo-amd64.qcow2 ; read -n1 -p \"Check the disk is unmounted and there is a new entry in the history for unmounted disk. Any key to end.\" && exit 0'"

      comment: |
        The interactive is running on one terminal. A LVM system residing in a qcow2 file is mounted 
        from another terminal. The new mounted disk appears live on the console. Then, the disk file
        is unmounted from the terminal. A new entry for the disk file appears live in the history of 
        the console.

  switchhist:
    _categories: ["history", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Switching to another mount history
    1:
      name: Switching to another mount history
      live-recording: yes
      pre-command: |
        echo > ~/.local/sumo/log.txt # Reset log for the test
      command : |
        gnome-terminal --geometry 150x35+0+0 --title="mountpilot" --wait --command="bash -c 'echo \"STARTING WITH BLANK HISTORY. MOUNT AND UNMOUNT WINDOWS PART AND QUIT.\" && mp -H blank && echo \"STARTING WITH HISTORY DEMO2, SAVING CURRENT TO WIN. REMOVE 3 LAST HISTORY ITEMS.\" && mp -H demo2:win && echo \"STARTING WITH HISTORY WIN, NO SAVING\" && mp -H win && echo \"STARTING WITH HISTORY DEMO2, NO SAVING? CHECK THAT REMOVED HISTORY ITEMS ARE STILL THERE\" && mp -H demo2'"

      comment: |
        MountPilot is started with a previoulsy saved 'blank' history.
        The Windows partition is mounted and then unmounted to create a new entry in history.
        It is restarted with history demo2 and saving the current history to win.
        Remove the 3 last history items. It is restarted with history win without saving the current history.
        Once started, it can be observed that the previous Windows mount is indeed in the saved history.
        It is restarted again with the demo2 history (without saving). It can be observed that the full
        demo2 history is there, because this history was not saved before after erasing history items.

  ghosthist:
    _categories: ["history", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Mount ghost mode
    1:
      name: Ghost mode
      live-recording: yes
      command : |
        gnome-terminal --geometry 150x35+0+0 --title="mountpilot" --wait --command="bash -c 'echo \"STARTING WITH DEMO2 HISTORY IN GHOST MODE. REMOVE 3 FIRST HISTORY ITEMS AND QUIT\" && mp --ghost -H demo2 && echo \"STARTING IN NORMAL MODE WITH LAST HISTORY. CHECK NO CHANGE, DEMO2 FULL HISTORY IS THERE. THEN, REMOVE AGAIN 3 FIRST HISTORY ITEMS AND QUIT\" && mp && echo \"STARTING WITH IN NORMAL MODE. CHECK HISTORY IS EMPTY\" && mp'"

      comment: |
        MountPilot is started in ghost mode with demo2 history. All items are removed.
        It is restarted without ghost mode. It can be checked that the previous history was untouched.
        Now removing again all history item. After restart, it can be checked that the history is empty,
        because the ghost mode was not used in the second start.

  label_i:
    _categories: ["disk-op-console", "manual"]
    _ignore-for-manpage: yes
    _title: |
      Label a filesystem
    1:
      name: Example of labelling a filesystem with the interactive console
